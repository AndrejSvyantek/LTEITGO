  /* ---- file intake ---- */
  function addDataset(name, text) {
    const parsed = CSVIO.parse(text);
    if (!parsed.header.length || !parsed.rows.length) { U.toast('"' + name + '" contained no usable rows.', 'err'); return null; }
    const d = {
      id: 'ds' + (State.seq++), name: name,
      header: parsed.header, rows: parsed.rows, delimiter: parsed.delimiter,
      mapping: {}, autoFlags: {}, badValueCount: 0
    };
    const auto = autoMap(parsed.header, parsed.rows);
    Object.keys(auto).forEach(k => { d.mapping[k] = auto[k]; d.autoFlags[k] = true; });
    State.datasets.push(d);
    State.activeId = d.id;
    return d;
  }
  function handleFiles(files) {
    const arr = Array.prototype.slice.call(files || []);
    if (!arr.length) return;
    let pending = arr.length;
    arr.forEach(f => {
      const fr = new FileReader();
      fr.onload = () => {
        addDataset(f.name.replace(/\.(csv|txt|tsv)$/i, ''), String(fr.result));
        if (--pending === 0) { bump(); U.toast(arr.length + ' file(s) loaded.', 'ok'); }
      };
      fr.onerror = () => { if (--pending === 0) bump(); U.toast('Could not read ' + f.name, 'err'); };
      fr.readAsText(f);
    });
  }
  function loadAllDemos() {
    const id = 'demo-proxy', nm = 'Demo (synthetic)';
    let n = 0;
    if (!State.datasets.some(d => d.name === nm)) {
      const node = document.getElementById(id);
      if (node && addDataset(nm, node.textContent)) n++;
    }
    bump();
    U.toast(n ? 'Synthetic demo loaded. These numbers are invented, not an experiment.' : 'The synthetic demo is already loaded.', n ? 'ok' : '');
  }
  return { build, addDataset, loadAllDemos };
})();
/* -------------------------------------------------------------------------
   V I E W   1 :  L T E   C O M P U T A T I O N
   One cell, several decision frameworks at once. A framework is a plotting
   position paired with an estimator; the module shows the arithmetic, overlays
   the frameworks on one curve, quantifies how far apart they land across the
   whole file, and lets the winner be adopted everywhere.
   ------------------------------------------------------------------------- */
const ViewLTE = (() => {
  const ESTIMATORS = LTE.EST_ORDER.map(k => LTE.EST[k]);
  const fwId = LTE.fwId;
  const fwParts = LTE.fwParts;
  const fwLabel = (id, kind) => LTE.fwLabel(id, kind);
  const ALL_FW = [];
  LTE.PP_ORDER.forEach(pp => ESTIMATORS.forEach(e => ALL_FW.push(fwId(pp, e.k))));
  /* stable color per framework so the eye can follow one choice between cells */
  const FW_COLOR = {};
  ALL_FW.forEach((id, i) => {
    const pal = Scene.PALETTES.journal.colors.concat(Scene.PALETTES.okabe.colors);
    FW_COLOR[id] = pal[i % pal.length];
  });

  const activeId = () => fwId(State.lte.pp, State.lte.method);
  /* full precision for the export, without trailing floating-point dust */
  const csvNum = v => isFinite(v) ? String(Number(v.toFixed(6))) : '';
  function selected() {
    const L = State.lteLab;
    if (!L.frameworks || !L.frameworks.length) {
      /* seed with the framework in force plus the other two plotting positions under
         the same estimator, which is the comparison that matters most */
      L.frameworks = LTE.PP_ORDER.map(pp => fwId(pp, State.lte.method));
    }
    L.frameworks = ALL_FW.filter(id => L.frameworks.indexOf(id) >= 0);
    if (!L.frameworks.length) L.frameworks = [activeId()];
    return L.frameworks;
  }
  const summarizeAs = (values, id) => {
    const p = fwParts(id);
    return LTE.summarize(values, { pp: p.pp, method: p.est, sigmoidMinN: State.lte.sigmoidMinN });
  };

  /* ---- the cell in focus ---- */
  function candidates() {
    const L = State.lteLab;
    let rows = computeSummaries().filter(s => s.dsId === L.dsId);
    if (L.event) rows = rows.filter(s => s.event === L.event);
    if (L.onlyFlagged) rows = rows.filter(s => s.stats.flags.length);
    return rows;
  }
  function focal() {
    const L = State.lteLab, rows = candidates();
    let hit = rows.filter(s => s.key === L.cellKey)[0];
    if (!hit) { hit = rows[0]; L.cellKey = hit ? hit.key : ''; }
    return hit || null;
  }

  function tutorial() {
    return U.el('details', { class: 'tut' }, [
      U.el('summary', {}, [U.el('span', { class: 'tag' }, 'TUTORIAL'), 'LTE computation - watch one cell become LTE10, LTE50 and LTE90, and compare the ways of doing it']),
      U.el('div', {
        class: 'tutbody', html: `
        <p>A cell holds a handful of buds. Each bud freezes once and gives one exotherm, so a cell with five buds
        gives five temperatures - nothing more. Turning those few numbers into \u201Cthe temperature at which 10 % of the buds
        had frozen\u201D takes two decisions, and this module makes both of them visible instead of burying them.</p>
        <ol class="steps">
          <li><b>Pick a cell.</b> Use the picker on the left. <i>Only cells carrying a quality flag</i> is the fastest way to
              see where the decisions actually bite - small cells and extrapolated tails.</li>
          <li><b>Read the arithmetic.</b> The first table sorts the exotherms warmest to coldest and gives each one a
              cumulative fraction frozen. That fraction is the <b>plotting position</b>, and it is the first decision:
              Halfway ranks put the coldest bud of five at 90 %, Expected ranks at 83 %, Min-to-max ranks
              at 100 %. Nothing else changes - same buds, same temperatures, different y values.</li>
          <li><b>Choose the estimator.</b> The selector on the left picks linear interpolation, a two-parameter logistic,
              or a four-parameter logistic (interpolation as fallback). The formulae and a worked fit live in
              <i>LTE Calculations Explained</i>.</li>
          <li><b>Overlay, or facet.</b> The default draws every ticked framework on one set of axes. Tick
              <i>Facet by plotting position</i> to put Halfway ranks, Expected ranks and Min-to-max ranks

              <i>Facet by estimator</i> to give interpolation and each sigmoid family its own panel. Both together give a grid.
              Where the lines separate is the size of the methodological choice; LTE50 barely moves, LTE10 and LTE90 can
              move by a degree or more.</li>
          <li><b>Check it against the whole file.</b> Step 3 reports how far each framework moves LTE10 / 50 / 90 from
              the one in force. Step 4 asks a different question: which framework recovers a hidden exotherm most
              closely, cell by cell, across the file. That is the comparison that can pick a winner; a shift table cannot.</li>
          <li><b>Adopt one.</b> <i>Use everywhere</i> makes that framework the one every other module uses - the summary
              table, the heat maps, the ANOVA and the figures all recompute from it.</li>
        </ol>
        <div class="formula">p(n) = fraction frozen at exotherm n of N, warmest first
Halfway (n \u2212 0.5)/N      Expected n/(N + 1)      Min-to-max (n \u2212 1)/(N \u2212 1)
LTE_x = temperature where p = x, by interpolation or from a fitted sigmoid</div>
        <div class="why"><b>Why this module exists:</b> with three to five buds per cell the plotting position is not a
        cosmetic detail. It decides whether LTE90 is read off the coldest bud you actually observed or extrapolated past
        it. Publishing the choice, and showing that the conclusion holds under the alternatives, is cheaper than being
        asked for it later. <i>LTE Calculations Explained</i> works every formula with the numbers of one cell.</div>` })
    ]);
  }

  /* ---- the figure: one overlay, or a facet grid on plotting position and/or estimator ---- */
  function curveOpts(cell, ids, lo, hi, w, h) {

    return {
      series: ids.map(id => ({
        label: fwLabel(id) + (id === activeId() ? '  (in force)' : ''),
        summary: summarizeAs(cell.values, id), color: FW_COLOR[id]
      })),
      width: w, height: h, tLo: lo, tHi: hi,
      secondary: L.secondary, showReadout: L.showGuides
    };
  }
  function emptyPanel(w, h) {

    const subtitle = cell.stats.n + ' exotherm' + (cell.stats.n === 1 ? '' : 's') +
      ' \u00B7 ' + nFw + ' framework' + (nFw === 1 ? '' : 's') +
      ' \u00B7 ' + Recreate.labLayout();
    const footnote = 'Markers are the same observed exotherms under each framework\u2019s plotting position; diamonds are that framework\u2019s LTE10, LTE50 and LTE90.';
    const allT = [];
    ids.forEach(id => {
      const sm = summarizeAs(cell.values, id);
      sm.curve.T.forEach(v => allT.push(v));
      if (isFinite(sm.lte10)) allT.push(sm.lte10);
      if (isFinite(sm.lte90)) allT.push(sm.lte90);
    });
    const [lo, hi] = Scene.padRange(Math.min.apply(null, allT.length ? allT : [-25, -15]), Math.max.apply(null, allT.length ? allT : [-25, -15]), 0.08);

    if (!L.facetPp && !L.facetEst) {
      return Charts.lteCurve(Object.assign(curveOpts(cell, ids, lo, hi, 1000, 420),
        { title, subtitle, footnote }));
    }

    const pps = LTE.PP_ORDER.filter(pp => ids.some(id => fwParts(id).pp === pp));
    const ests = ESTIMATORS.map(e => e.k).filter(k => ids.some(id => fwParts(id).est === k));
    const nCol = L.facetPp ? Math.max(1, pps.length) : Math.max(1, ests.length);
    const pw = nCol >= 3 ? 440 : nCol === 2 ? 520 : 780;
    const ph = 340;
    const panels = [];
    const pushPanel = (label, panelIds) => {
      panels.push({
        label,
        scene: panelIds.length
          ? Charts.lteCurve(curveOpts(cell, panelIds, lo, hi, pw, ph))
          : emptyPanel(pw, ph)
      });
    };

    if (L.facetPp && L.facetEst) {
      ests.forEach(est => pps.forEach(pp => {
        const id = fwId(pp, est);
        pushPanel(LTE.fwLabel(id),
          ids.indexOf(id) >= 0 ? [id] : []);
      }));
    } else if (L.facetPp) {
      pps.forEach(pp => pushPanel(LTE.PP[pp].full, ids.filter(id => fwParts(id).pp === pp)));
    } else {
      ests.forEach(est => pushPanel(LTE.EST[est].full,
        ids.filter(id => fwParts(id).est === est)));
    }
    return Charts.facetGrid({
      panels, cols: nCol,
      title, subtitle, footnote,
      gapX: 22, gapY: 20
    });
  }

  /* ---- table 3: how the choice moves the whole file ---- */
  function sensitivityRows() {
    const L = State.lteLab;
    const cells = computeSummaries().filter(s => s.dsId === L.dsId && (!L.event || s.event === L.event));
    const act = activeId();
    return selected().map(id => {
      const per = cells.map(c => ({ a: summarizeAs(c.values, act), b: summarizeAs(c.values, id) }));
      const stat = k => {
        const vals = per.map(x => x.b[k]).filter(isFinite);
        const diffs = per.filter(x => isFinite(x.a[k]) && isFinite(x.b[k])).map(x => x.b[k] - x.a[k]);
        return {
          mean: LTE.mean(vals),
          meanAbs: diffs.length ? LTE.mean(diffs.map(Math.abs)) : NaN,
          maxAbs: diffs.length ? Math.max.apply(null, diffs.map(Math.abs)) : NaN
        };
      };
      const flagged = code => per.filter(x => x.b.flags.some(f => f.code === code)).length;
      return {
        id: id, n: cells.length,
        lte10: stat('lte10'), lte50: stat('lte50'), lte90: stat('lte90'),
        extrap: flagged('extrapolated'), fellBack: flagged('below-min-n') + flagged('fit-failed'), poor: flagged('poor-fit')

  /* ---- table 4: which framework describes the file ---- */
  function fitScopeCells() {
    const L = State.lteLab;
    return computeSummaries().filter(s => s.dsId === L.dsId && (!L.event || s.event === L.event));
  }
  function fitRows() {
    const L = State.lteLab;
    const ids = selected();
    const key = [L.dsId, L.event || '', State.lte.sigmoidMinN, ids.join(',')].join('|');
    if (L.fitCache && L.fitCache.key === key) return L.fitCache.rows;
    const cells = fitScopeCells();
    const rows = ids.map(id => {
      const p = fwParts(id);
      const opts = { pp: p.pp, method: p.est, sigmoidMinN: State.lte.sigmoidMinN };
      const r2s = [], inRmse = [], cellMae = [], allErr = [];
      let attempted = 0, fitted = 0, poor = 0, scored = 0, held = 0;
      cells.forEach(c => {
        const s = summarizeAs(c.values, id);
        if (LTE.isSigmoid(p.est)) {
          attempted++;
          if (s.fit && s.fit.ok) {
            fitted++;
            if (isFinite(s.fit.r2)) r2s.push(s.fit.r2);
            if (isFinite(s.fit.rmse)) inRmse.push(s.fit.rmse);
            if (s.fit.r2 < 0.9) poor++;
          }
        }
        if (c.values.filter(v => typeof v === 'number' && isFinite(v)).length < 4) return;
        const loo = LTE.looScore(c.values, opts);
        if (!loo.ok) return;
        scored++;
        held += loo.n;
        cellMae.push(loo.mae);
        loo.folds.forEach(f => allErr.push(f.err));
      });
      const pooledMae = allErr.length ? LTE.mean(allErr.map(Math.abs)) : NaN;
      const pooledRmse = allErr.length ? Math.sqrt(LTE.mean(allErr.map(e => e * e))) : NaN;
      return {
        id: id, n: cells.length, scored: scored, held: held,
        cellMae: cellMae.length ? LTE.mean(cellMae) : NaN,
        pooledMae: pooledMae, pooledRmse: pooledRmse,
        medR2: r2s.length ? LTE.median(r2s) : NaN,
        medInRmse: inRmse.length ? LTE.median(inRmse) : NaN,
        attempted: attempted, fitted: fitted, poor: poor,
        isLogistic: LTE.isSigmoid(p.est)
      };
    });
    const scored = rows.filter(r => isFinite(r.cellMae));
    let best = null;
    scored.forEach(r => { if (!best || r.cellMae < best.cellMae - 1e-9) best = r; });
    if (best) best.best = true;
    L.fitCache = { key: key, rows: rows };
    return rows;
  }

  }

    const fitT = fitTable();

      'Interpolation passes through every observed point, so it has no in-sample residual and cannot be scored by R\u00B2. Plotting positions are conventions, not fitted models. To put the nine frameworks on the same footing, each exotherm in a cell with enough buds is hidden in turn; the remaining buds recover its temperature at that bud\u2019s full-sample plotting position. The closest recovery is the smallest mean cell |error| - a description of these cells, not a proof that the curve is biologically true. The formulae behind the sigmoids are in LTE Calculations Explained.'));

  function tutorial() {

  function filtered() {
    const f = State.m1.filters;
    let s = computeSummaries();
    if (f.ds) s = s.filter(x => x.dsId === f.ds);
    if (f.event) s = s.filter(x => x.event === f.event);
    if (f.run) s = s.filter(x => x.run === f.run);
    if (f.tray) s = s.filter(x => x.tray === f.tray);
    if (f.flagged) s = s.filter(x => x.stats.flags.length > 0);
    if (f.q) {
      const q = f.q.toLowerCase();
      s = s.filter(x => (x.treatment + ' ' + x.block + ' ' + x.position + ' ' + x.event + ' ' + Object.keys(x.attrs).map(k => x.attrs[k]).join(' ')).toLowerCase().indexOf(q) >= 0);
    }
    const cols = BASE_COLS.concat(showExtra ? EXTRA_COLS : []);
    const sc = cols.filter(c => c.k === State.m1.sort.key)[0];
    if (sc) {
      const dir = State.m1.sort.dir;
      s = s.slice().sort((a, b) => {
        if (sc.num) { const x = sc.num(a), y = sc.num(b); const xf = isFinite(x), yf = isFinite(y); if (!xf && !yf) return 0; if (!xf) return 1; if (!yf) return -1; return (x - y) * dir; }
        return U.natCmp(sc.get(a), sc.get(b)) * dir;
      });
    }
    return s;
  }

  /* ---- exports ---- */
  function csvRows() {
    const cols = BASE_COLS.concat(EXTRA_COLS);
    const attrKeys = U.uniq([].concat.apply([], computeSummaries().map(s => Object.keys(s.attrs))));
    const head = cols.map(c => c.lab).concat(attrKeys).concat(['Flags']);
    const body = filtered().map(s => cols.map(c => {
      const raw = c.num ? c.num(s) : c.get(s);

      return String(raw === undefined || raw === null ? '' : raw).replace('\u2014', '');
    }).concat(attrKeys.map(k => s.attrs[k] === undefined ? '' : s.attrs[k]))
      .concat([s.stats.flags.map(f => f.code).join('; ')]));

      mb.appendChild(seg);
    }

    /* focus of the comparison */
    if (fx.length) {
      mb.appendChild(U.el('div', { class: 'lab', style: { marginTop: '12px', fontSize: '11.5px', fontWeight: '600', color: 'var(--ink-2)', textTransform: 'uppercase', letterSpacing: '.04em' } }, 'Compare LS-means of'));
      const seg = U.el('div', { class: 'seg' });
      fx.forEach(c => {
        const on = focus.indexOf(c) >= 0;
        seg.appendChild(U.el('button', {
          class: 'pill' + (on ? ' on' : ''),
          onclick: () => { if (on) focus = focus.filter(x => x !== c); else focus.push(c); m.result = null; build(); }
        }, c));
      });
      mb.appendChild(seg);
      mb.appendChild(U.el('div', { class: 'tiny muted', style: { marginTop: '5px' } },
        focus.length > 1 ? 'Cell means of ' + focus.join(' \u00D7 ') + ' are compared against each other.' : 'Marginal means, averaged equally over every other fixed effect.'));
    }
    mc.appendChild(mb);
    col.appendChild(mc);

    /* ---- inference settings ---- */
    const sc2 = U.el('div', { class: 'card' }, [U.el('h3', {}, 'Inference & table format')]);
    const sb = U.el('div', { class: 'body' });
    sb.appendChild(U.el('label', { class: 'field' }, [U.el('span', { class: 'lab' }, 'Post-hoc test'),
      U.el('select', { onchange: e => { m.test = e.target.value; m.result = null; build(); } },
        Post.TEST_ORDER.map(k => U.el('option', { value: k, selected: m.test === k ? true : null }, Post.TESTS[k].label))),
      U.el('span', { class: 'tiny muted' }, Post.TESTS[m.test].note)]));
    sb.appendChild(U.el('div', { class: 'row' }, [
      U.el('label', { class: 'field', style: { flex: '1' } }, [U.el('span', { class: 'lab' }, 'Alpha'),
        U.el('select', { onchange: e => { m.alpha = parseFloat(e.target.value); m.result = null; build(); } },
          [0.001, 0.01, 0.05, 0.1].map(a => U.el('option', { value: a, selected: m.alpha === a ? true : null }, String(a))))]),
      U.el('label', { class: 'field', style: { flex: '1' } }, [U.el('span', { class: 'lab' }, 'Denominator df'),
        U.el('select', { onchange: e => { m.ddf = e.target.value; m.result = null; build(); } }, [
          U.el('option', { value: 'containment', selected: m.ddf === 'containment' ? true : null }, 'Containment'),
          U.el('option', { value: 'residual', selected: m.ddf === 'residual' ? true : null }, 'Residual')])])
    ]));
    sb.appendChild(U.el('div', { class: 'row' }, [
      U.el('label', { class: 'field', style: { flex: '1' } }, [U.el('span', { class: 'lab' }, 'Error term in tables'),
        U.el('select', { onchange: e => { m.errorType = e.target.value; m.result = null; build(); } }, [
          U.el('option', { value: 'se', selected: m.errorType === 'se' ? true : null }, 'Standard error of the mean'),
          U.el('option', { value: 'sd', selected: m.errorType === 'sd' ? true : null }, 'Standard deviation')])]),
      U.el('label', { class: 'field', style: { flex: '1' } }, [U.el('span', { class: 'lab' }, 'Decimals'),
        U.el('select', { onchange: e => { m.decimals = parseInt(e.target.value, 10); renderResult(); } },
          [1, 2, 3].map(d => U.el('option', { value: d, selected: m.decimals === d ? true : null }, String(d))))])
    ]));
    sb.appendChild(U.el('label', { class: 'chk' }, [
      U.el('input', { type: 'checkbox', checked: m.descending ? true : null, onchange: e => { m.descending = e.target.checked; m.result = null; build(); } }),
      U.el('span', {}, ['Letter A to the numerically highest mean', U.el('span', { class: 'sub' }, m.descending ? 'A is the warmest, least hardy value' : 'A is the coldest, hardiest value')])
    ]));
    sb.appendChild(U.el('label', { class: 'chk' }, [
      U.el('input', { type: 'checkbox', checked: m.avgSubsamples ? true : null, onchange: e => { m.avgSubsamples = e.target.checked; m.result = null; build(); } }),
      U.el('span', {}, ['Average subsamples first', U.el('span', { class: 'sub' }, 'collapse repeated cells within a fixed-by-random combination before fitting')])
    ]));
    sc2.appendChild(sb);
    sb.appendChild(U.el('button', { class: 'btn primary', style: { width: '100%', marginTop: '6px' }, onclick: run }, 'Fit models'));
    col.appendChild(sc2);
    return col;
  }

  /* ---------------- model fitting ---------------- */
  function run() {
    const rows = sourceRows();
    const fx = rolesOf('fixed'), cv = rolesOf('covar'), rd = rolesOf('random');
    if (!fx.length && !cv.length) { U.toast('Give at least one column the role "fixed" before fitting.', 'err'); return; }
    if (!selTraits.length) { U.toast('Tick at least one response trait.', 'err'); return; }
    if (!focus.length && fx.length) focus = [fx[0]];

    const splits = splitBy ? U.sortNat(U.uniq(rows.map(r => String(r[splitBy] === undefined ? '' : r[splitBy])))) : [''];
    const groups = [];
    splits.forEach(sv => {
      const sub0 = splitBy ? rows.filter(r => String(r[splitBy]) === sv) : rows;
      const g = { splitKey: sv, traits: {}, warnings: [], n: sub0.length };
      /* subsample detection on the fixed x random grid */
      if (rd.length && fx.length) {
        const cells = U.groupBy(sub0, r => fx.concat(rd).map(c => r[c]).join('\u241F'));
        let dup = 0; cells.forEach(a => { if (a.length > 1) dup++; });
        if (dup) g.warnings.push(dup + ' combination(s) of ' + fx.concat(rd).join(' \u00D7 ') + ' contain more than one cell. ' +
          (State.m3.avgSubsamples ? 'They were averaged before fitting, as requested.' : 'They are being treated as independent observations, which adds residual degrees of freedom. Tick "Average subsamples first" if they are subsamples of the same experimental unit.'));
      }
      selTraits.forEach(tr => {
        let sub = sub0;
        if (State.m3.avgSubsamples && rd.length && fx.length) {
          const keys = fx.concat(cv).concat(rd);
          const grouped = U.groupBy(sub0.filter(r => isFinite(r[tr])), r => keys.map(c => r[c]).join('\u241F'));
          const agg = [];
          grouped.forEach(arr => {
            const rep = Object.assign({}, arr[0]);
            rep[tr] = LTE.mean(arr.map(r => r[tr]));
            rep.__nSub = arr.length;
            agg.push(rep);
          });
          sub = agg;
        }
        g.traits[tr] = fitTrait(sub, tr, fx, cv, rd);
      });
      groups.push(g);
    });
    State.m3.result = {
      groups, traits: selTraits.slice(), focus: focus.slice(), splitBy,
      fixed: fx, covars: cv, randoms: rd, inters: inters.map(t => t.slice()),
      datasets: (State.m3.dsIds || []).map(id => (dsById(id) || {}).name).filter(Boolean),
      settings: JSON.parse(JSON.stringify({ test: State.m3.test, alpha: State.m3.alpha, ddf: State.m3.ddf, errorType: State.m3.errorType, descending: State.m3.descending, lte: State.lte }))
    };
    renderResult();
    U.toast('Fitted ' + selTraits.length + ' trait(s) across ' + groups.length + ' analysis group(s).', 'ok');
  }

  function fitTrait(rows, trait, fx, cv, rd) {
    const design = Design.build(rows, {
      response: r => r[trait],
      factors: fx, covars: cv,
      inters: inters.filter(t => t.every(c => fx.indexOf(c) >= 0)),
      randoms: rd.map(c => ({ name: c, cols: [c] }))
    });
    if (!design.ok) return { ok: false, reason: design.reason, warnings: design.warnings || [] };
    const fit = Mixed.fit(design.y, design.X, design.Zs, { ddf: State.m3.ddf });
    if (!fit.ok) return { ok: false, reason: fit.reason, warnings: design.warnings };
    const ddf = State.m3.ddf === 'residual' ? fit.ddfResidual : fit.ddfContainment;

    /* Type III tests */
    const anova = design.terms.filter(t => t.type !== 'intercept').map(t => {
      const L = Design.termContrast(design, t);
      const r = L.length ? Mixed.ftest(fit, L, ddf) : null;
      return { term: t.name, type: t.type, numDf: r ? r.numDf : 0, denDf: ddf, F: r ? r.F : NaN, p: r ? r.p : NaN, aliased: t.aliased };
    });

    /* LS-means on the focus factors */
    const foc = focus.filter(c => design.factors.indexOf(c) >= 0);
    let means = [], cmp = null;
    if (foc.length) {
      const levelSets = foc.map(c => design.info[c].levels);
      Design.cartesianIdx(levelSets.map(l => l.length)).forEach(ix => {
        const lv = {};
        foc.forEach((c, i) => lv[c] = levelSets[i][ix[i]]);
        const key = foc.map(c => lv[c]).join(' \u00B7 ');
        const obs = design.rows.filter(u => foc.every(c => String(u.row[c]) === lv[c]));
        if (!obs.length) return;
        const con = Design.lsmeanContrast(design, foc, lv);
        const est = Mixed.estimate(fit, con.L);
        const raw = obs.map(u => u.y);
        means.push({
          key, levels: lv, est: est.est, se: est.se, estimable: con.estimable && isFinite(est.est),
          n: obs.length, rawMean: LTE.mean(raw), rawSd: LTE.sd(raw), L: con.L, values: raw
        });
      });
      cmp = Post.compare(means, ddf, {
        test: State.m3.test, alpha: State.m3.alpha, descending: State.m3.descending,
        seDiff: (a, b) => Mixed.contrastDiff(fit, a.L, b.L).se
      });
    }
    return { ok: true, design, fit, ddf, anova, means, cmp, warnings: design.warnings };
  }

  /* ---------------- result rendering ---------------- */
  let resultHost = null;
  function renderResult() {
    if (!resultHost) return;
    U.clear(resultHost);
    const res = State.m3.result;
    if (!res) {
      resultHost.appendChild(U.el('div', { class: 'card' }, [U.el('div', { class: 'body' }, [
        U.el('div', { class: 'notice info' }, 'Set up the model on the left and press <b>Fit models</b>. A suggested starting point is already filled in: the treatment column as a fixed effect, the block column as a random effect, and a separate analysis per collection event.')
      ])]));
      return;
    }
    const dec = State.m3.decimals;
    res.groups.forEach(g => {
      const card = U.el('div', { class: 'card' }, [U.el('h3', {}, [
        res.splitBy ? res.splitBy + ': ' + (g.splitKey || '(blank)') : 'Combined analysis',
        U.el('span', { class: 'hint' }, g.n + ' cells')
      ])]);
      const body = U.el('div', { class: 'body' });
      g.warnings.forEach(w => body.appendChild(U.el('div', { class: 'notice' }, w)));

      res.traits.forEach(tr => {
        const R = g.traits[tr];
        const meta = LTE.statMeta(tr);
        body.appendChild(U.el('h4', { style: { margin: '14px 0 6px', fontSize: '13px' } }, meta.full));
        if (!R.ok) { body.appendChild(U.el('div', { class: 'notice err' }, 'Not fitted - ' + R.reason)); return; }
        (R.warnings || []).forEach(w => body.appendChild(U.el('div', { class: 'notice' }, w)));

        /* variance components */
        const vcT = U.el('table', { class: 'mini' });
        vcT.appendChild(U.el('thead', {}, [U.el('tr', {}, ['Variance component', 'Levels', 'Estimate', '% of total'].map(h => U.el('th', {}, h)))]));
        vcT.appendChild(U.el('tbody', {}, R.fit.vc.map(v => U.el('tr', {}, [
          U.el('td', {}, v.name + (v.boundary ? ' (estimated at the boundary, effectively zero)' : '')),
          U.el('td', {}, v.q === null ? '\u2014' : v.q),
          U.el('td', {}, U.fx(v.variance, 4)),
          U.el('td', {}, U.fx(v.pct, 1) + ' %')
        ]))));
        const vcLabel = (g.splitKey || 'combined') + ' \u00B7 ' + meta.label;
        body.appendChild(U.el('details', { class: 'foldout' }, [
          U.el('summary', {}, 'Variance components and model fit'),
          U.el('div', { class: 'fb' }, [vcT, U.el('div', { class: 'tiny muted', style: { marginTop: '6px' } },
            'n = ' + R.fit.n + ' \u00B7 ' + R.fit.p + ' fixed parameters \u00B7 residual SD = ' + U.fx(Math.sqrt(R.fit.sigma2e), 3) +
            ' \u00B7 denominator df = ' + U.fx(R.ddf, 1) + ' (' + R.fit.ddfMethod + ') \u00B7 \u22122 REML log-likelihood = ' + U.fx(-R.fit.reml2LL, 3)),
          Tables.bar(() => vcT, () => Recreate.stats(res, 'variance components', vcLabel), { title: () => Recreate.stats(res, 'variance components', vcLabel), landscape: false })])
        ]));

        /* ANOVA */
        const anT = U.el('table', { class: 'grid' });
        anT.appendChild(U.el('thead', {}, [U.el('tr', {}, [U.el('th', { class: 'txt' }, 'Source'), U.el('th', {}, 'num df'), U.el('th', {}, 'den df'), U.el('th', {}, 'F'), U.el('th', {}, 'p'), U.el('th', { class: 'txt' }, '')].map(x => x))]));
        anT.appendChild(U.el('tbody', {}, R.anova.map(a => U.el('tr', {}, [
          U.el('td', { class: 'txt', style: { fontWeight: '600' } }, a.term),
          U.el('td', {}, a.numDf), U.el('td', {}, U.fx(a.denDf, 1)),
          U.el('td', {}, U.fx(a.F, 3)), U.el('td', { style: { fontWeight: a.p < State.m3.alpha ? '700' : '400' } }, U.pval(a.p)),
          U.el('td', { class: 'txt' }, a.p < 0.001 ? '***' : a.p < 0.01 ? '**' : a.p < 0.05 ? '*' : a.p < 0.1 ? '\u2020' : '')
        ]))));
        body.appendChild(U.el('div', { class: 'scrollx' }, anT));
        body.appendChild(Tables.bar(() => anT, () => Recreate.stats(res, 'ANOVA', vcLabel),
          { label: 'Export ANOVA', title: () => Recreate.stats(res, 'ANOVA', vcLabel), intro: methodsParagraph(res), landscape: false }));

        if (R.cmp) {
          const fTerm = R.anova.filter(a => a.term === res.focus.join(' \u00D7 '))[0] || R.anova.filter(a => a.term === res.focus[0])[0];
          if (fTerm && isFinite(fTerm.p) && fTerm.p >= State.m3.alpha) {
            body.appendChild(U.el('div', { class: 'notice' },
              'The Type III F test for ' + fTerm.term + ' is not significant (p = ' + U.pval(fTerm.p) + '). The letters below will usually come out all the same; treat any separation as exploratory.'));
          }
          const meansWrap = pubTable(R, tr, dec);
          body.appendChild(meansWrap);
          body.appendChild(Tables.bar(() => meansWrap.querySelector('table'), () => Recreate.stats(res, 'LS-means', vcLabel),
            { label: 'Export means', title: () => Recreate.stats(res, 'LS-means', vcLabel), intro: methodsParagraph(res), landscape: false }));
          const pairWrap = pairTable(R, dec);
          body.appendChild(U.el('details', { class: 'foldout' }, [
            U.el('summary', {}, 'All ' + R.cmp.nComparisons + ' pairwise comparisons (' + R.cmp.testLabel + ')'),
            U.el('div', { class: 'fb' }, [pairWrap,
              Tables.bar(() => pairWrap.querySelector('table'), () => Recreate.stats(res, 'pairwise', vcLabel + ' ' + R.cmp.testLabel),
                { label: 'Export comparisons', title: () => Recreate.stats(res, 'pairwise', vcLabel + ' ' + R.cmp.testLabel), intro: R.cmp.testLabel + ' at \u03B1 = ' + R.cmp.alpha, landscape: false })])
          ]));
        }
      });
      card.appendChild(body);
      resultHost.appendChild(card);
    });

    /* combined publication table + exports */
    resultHost.appendChild(exportCard(res));
  }

  function errOf(m, R) { return State.m3.errorType === 'sd' ? m.rawSd : m.se; }

  function pubTable(R, trait, dec) {
    const wrap = U.el('div', { class: 'scrollx' });
    const t = U.el('table', { class: 'grid' });
    const head = ['Level', 'n', 'LS-mean', '\u00B1', State.m3.errorType === 'sd' ? 'SD' : 'SE', 'Group', 'Raw mean'];
    t.appendChild(U.el('thead', {}, [U.el('tr', {}, head.map((h, i) => U.el('th', { class: i === 0 || i === 5 ? 'txt' : '' }, h)))]));
    const ordered = R.means.slice().sort((a, b) => (State.m3.descending ? b.est - a.est : a.est - b.est));
    t.appendChild(U.el('tbody', {}, ordered.map(m => U.el('tr', {}, [
      U.el('td', { class: 'txt', style: { fontWeight: '600' } }, m.key),
      U.el('td', {}, m.n),
      U.el('td', {}, m.estimable ? U.fx(m.est, dec) : 'not estimable'),
      U.el('td', {}, m.estimable ? '\u00B1' : ''),
      U.el('td', {}, m.estimable ? U.fx(errOf(m, R), dec + 1) : ''),
      U.el('td', { class: 'txt', style: { fontWeight: '700' } }, m.letter || ''),
      U.el('td', { class: 'muted' }, U.fx(m.rawMean, dec))
    ]))));
    wrap.appendChild(t);
    wrap.appendChild(U.el('div', { class: 'tiny muted', style: { padding: '6px 2px' } },
      R.cmp.testLabel + ' at \u03B1 = ' + R.cmp.alpha + '; means sharing a letter do not differ. ' +
      (isFinite(R.cmp.crit) ? 'Critical multiplier ' + R.cmp.critLabel + ' = ' + U.fx(R.cmp.crit, 3) + ' on the standard error of a difference. ' : '') +
      'Denominator df = ' + U.fx(R.ddf, 1) + '.'));
    return wrap;
  }
  function pairTable(R, dec) {
    const t = U.el('table', { class: 'grid' });
    t.appendChild(U.el('thead', {}, [U.el('tr', {}, ['Comparison', 'Difference', 'SE', 't', 'df', 'p (raw)', 'p (adjusted)', ''].map((h, i) => U.el('th', { class: i === 0 ? 'txt' : '' }, h)))]));
    t.appendChild(U.el('tbody', {}, R.cmp.pairs.slice().sort((a, b) => a.p - b.p).map(p => U.el('tr', {}, [
      U.el('td', { class: 'txt' }, p.a + '  \u2212  ' + p.b),
      U.el('td', {}, U.fxs(p.diff, dec)), U.el('td', {}, U.fx(p.se, dec + 1)),
      U.el('td', {}, U.fx(p.t, 3)), U.el('td', {}, U.fx(p.df, 1)),
      U.el('td', { class: 'muted' }, U.pval(p.pRaw)),
      U.el('td', { style: { fontWeight: p.sig ? '700' : '400' } }, U.pval(p.p)),
      U.el('td', {}, p.sig ? '\u2713' : '')
    ]))));
    return U.el('div', { class: 'scrollx' }, t);
  }

  /* ---------------- the four-subcolumn publication table ---------------- */
  function pubMatrix(res) {
    /* rows = analysis group x focus level, columns = trait x {mean, ±, err, letter} */
    const rows = [];
    res.groups.forEach(g => {
      const anyTrait = res.traits.filter(tr => g.traits[tr] && g.traits[tr].ok)[0];
      if (!anyTrait) return;
      const keys = [];
      res.traits.forEach(tr => { const R = g.traits[tr]; if (R && R.ok) R.means.forEach(m => { if (keys.indexOf(m.key) < 0) keys.push(m.key); }); });
      const order = g.traits[anyTrait].means.slice().sort((a, b) => (State.m3.descending ? b.est - a.est : a.est - b.est)).map(m => m.key);
      keys.sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib); });
      keys.forEach(k => {
        const cells = res.traits.map(tr => {
          const R = g.traits[tr];
          if (!R || !R.ok) return null;
          const m = R.means.filter(x => x.key === k)[0];
          if (!m || !m.estimable) return null;
          return { est: m.est, err: errOf(m, R), letter: m.letter, n: m.n };
        });
        rows.push({ group: g.splitKey, level: k, cells });
      });
    });
    return rows;
  }
  function exportCard(res) {
    const card = U.el('div', { class: 'card' }, [U.el('h3', {}, ['Publication table', U.el('span', { class: 'hint' }, 'value \u00B7 \u00B1 \u00B7 error \u00B7 letter')])]);
    const body = U.el('div', { class: 'body' });
    const dec = State.m3.decimals;
    const mat = pubMatrix(res);
    const errLab = State.m3.errorType === 'sd' ? 'SD' : 'SE';
    /* on-screen preview of the exact structure that is exported */
    const t = U.el('table', { class: 'grid' });
    const h1 = [U.el('th', { class: 'txt', rowspan: 2 }, res.splitBy || 'Group'), U.el('th', { class: 'txt', rowspan: 2 }, res.focus.join(' \u00D7 '))];
    res.traits.forEach(tr => h1.push(U.el('th', { colspan: 4, style: { textAlign: 'center', borderLeft: '1px solid var(--line)' } }, LTE.statMeta(tr).label)));
    const h2 = [];
    res.traits.forEach(() => { h2.push(U.el('th', {}, 'mean')); h2.push(U.el('th', {}, '\u00B1')); h2.push(U.el('th', {}, errLab)); h2.push(U.el('th', { class: 'txt' }, 'sep.')); });
    t.appendChild(U.el('thead', {}, [U.el('tr', {}, h1), U.el('tr', {}, h2)]));
    t.appendChild(U.el('tbody', {}, mat.map(r => U.el('tr', {}, [
      U.el('td', { class: 'txt muted' }, r.group || '\u2014'),
      U.el('td', { class: 'txt', style: { fontWeight: '600' } }, r.level)
    ].concat([].concat.apply([], r.cells.map(c => [
      U.el('td', { style: { borderLeft: '1px solid var(--line-2)' } }, c ? U.fx(c.est, dec) : '\u2014'),
      U.el('td', { class: 'muted' }, c ? '\u00B1' : ''),
      U.el('td', {}, c ? U.fx(c.err, dec + 1) : ''),
      U.el('td', { class: 'txt', style: { fontWeight: '700' } }, c ? c.letter : '')
    ])))))));
    body.appendChild(U.el('div', { class: 'scrollx' }, t));
    body.appendChild(U.el('div', { class: 'tiny muted', style: { marginTop: '8px' } }, methodsParagraph(res)));
    card.appendChild(body);
    card.appendChild(U.el('div', { class: 'exportbar' }, [
      U.el('span', { class: 'lab' }, 'Export'),
      U.el('div', { class: 'btn-group' }, [
        U.el('button', { class: 'btn sm', onclick: () => exportPdf(res) }, 'PDF'),
        U.el('button', { class: 'btn sm', onclick: () => exportDocx(res) }, 'Word (.docx)'),
        U.el('button', { class: 'btn sm', onclick: () => exportDocxMeans(res) }, 'Word (means)'),
        U.el('button', { class: 'btn sm', onclick: () => exportCsvMeans(res) }, 'CSV (table)'),
        U.el('button', { class: 'btn sm', onclick: () => exportCsvAnova(res) }, 'CSV (ANOVA)'),
        U.el('button', { class: 'btn sm', onclick: () => exportCsvPairs(res) }, 'CSV (pairwise)')
      ]),
      U.el('span', { class: 'tiny muted' }, 'The PDF and Word files carry the four-subcolumn layout and horizontal rules only, ready to drop into a manuscript.')
    ]));
    return card;
  }

  function methodsParagraph(res) {
    const anyR = (() => { for (const g of res.groups) for (const tr of res.traits) if (g.traits[tr] && g.traits[tr].ok) return g.traits[tr]; return null; })();
    const test = anyR && anyR.cmp ? anyR.cmp.testLabel : Post.TESTS[State.m3.test].label;
    const terms = [].concat(res.fixed, res.inters.map(t => t.join(' \u00D7 ')), res.covars).filter(Boolean);
    return 'Data were analyzed with a mixed model fitted by restricted maximum likelihood, with ' +
      (terms.length ? terms.join(', ') + ' as fixed effect' + (terms.length > 1 ? 's' : '') : 'no fixed effects') +

const ViewM4 = (() => {

    { k: 'violin+box', l: 'Violin + box', src: 'cells', note: 'Density with the quartile box inside.' },
    { k: 'bar', l: 'Bar', src: 'any', note: 'Bar to the mean with an error bar; the usual carrier of separation letters.' },
    { k: 'point', l: 'Point / interval', src: 'any', note: 'Marker at the mean with an error bar - the cleanest option when dates are dodged.' }
  ];

  function tutorial() {

      U.el('div', { class: 'tutbody', html: `
        <p>Module 4 plots either the <b>raw distribution of cell values</b> (box, violin) or the <b>least-squares means from
        Module 3</b> (bar, point), and writes the separation letters above them.</p>
        <ol class="steps">
          <li><b>Choose the source.</b> <i>Cell values</i> shows every cell as data and is what box and violin plots need.
              <i>Module 3 least-squares means</i> shows the model estimates with their standard errors, which is what belongs
              next to an ANOVA table.</li>
          <li><b>Set the x axis and the grouping.</b> Put treatment on the x axis and the collection event in <i>Dodge by</i>
              to show several dates within one year side by side on a single plot.</li>
          <li><b>Control the look treatment by treatment.</b> Each grouping level gets its own color, hatch pattern, marker
              shape and opacity in the aesthetics panel. Hatching is drawn as real lines rather than a fill pattern, so it
              survives both the PDF and the journal's printer.</li>
          <li><b>Letters appear automatically</b> once Module 3 has been fitted with a matching grouping, because the plot
              looks the letters up from the model rather than recomputing them. If they are missing, the note under the plot
              says which factor to align.</li>
          <li><b>Export at the size you need.</b> Set the width in inches so the fonts come out right, then take the vector
              PDF or SVG, or a 600\u20131200 dpi PNG/JPEG.</li>
        </ol>
        <div class="why"><b>On bars of negative temperatures:</b> a bar baseline at zero produces the familiar downward bars, but

        plot, usually shows the treatment separation far more honestly.</div>` })

  function build() {

    const grid = U.el('div', { class: 'split wide' });

  /* One file, all of its collection events, is the default subset: pooling whole years into

  function cellRows() {

    if (!ds.filter(d => d.id === m.dsId).length) m.dsId = ds.filter(d => d.id === State.activeId).length ? State.activeId : (ds[0] ? ds[0].id : null);
    let rows = computeSummaries().filter(s => s.dsId === m.dsId);

/* -------------------------------------------------------------------------
   V I E W   C :  L T E   C A L C U L A T I O N S   E X P L A I N E D
   A worked walk-through of the LTE calculations, using either a canned
   five-bud cell or a cell from the loaded data.
   ------------------------------------------------------------------------- */
const ViewCalc = (() => {
  const EXAMPLE = {
    label: 'Worked example - five buds in one cell',
    values: [-16.50, -18.00, -19.50, -21.00, -23.00]
  };
  const TOC = [
    ['row', 'From a row to a cell'],
    ['order', '1. Order the exotherms'],
    ['pp', '2. Plotting positions'],
    ['interp', '3. Linear interpolation'],
    ['sigmoid', '4. Fitted sigmoids'],
    ['six', '5. The nine frameworks'],
    ['fit', '6. Which framework fits'],
    ['desc', '7. Cell summaries'],
    ['flags', '8. Quality flags'],
    ['maps', '9. Tray maps and plots'],
    ['force', '10. What \u201cin force\u201d means']
  ];

  function currentCell() {
    const sums = computeSummaries();
    if (State.calc.source === 'live' && sums.length) {
      const hit = sums.filter(s => s.key === State.calc.cellKey)[0] || sums[0];
      State.calc.cellKey = hit.key;
      return { label: hit.dsName + ' \u00B7 ' + hit.event + ' \u00B7 run ' + hit.run + ' \u00B7 ' + hit.position + (hit.treatment ? ' \u00B7 ' + hit.treatment : ''), values: hit.values.slice(), live: hit };
    }
    return { label: EXAMPLE.label, values: EXAMPLE.values.slice(), live: null };
  }

  function mini(headers, rows) {
    const t = U.el('table', { class: 'grid' });
    t.appendChild(U.el('thead', {}, [U.el('tr', {}, headers.map((h, i) => U.el('th', { class: i === 0 || h.txt ? 'txt' : '' }, h.lab || h)))]));
    const tb = U.el('tbody');
    rows.forEach(r => tb.appendChild(U.el('tr', {}, r.map((c, i) => {
      const cell = (c && typeof c === 'object' && !Array.isArray(c) && !(c instanceof Node)) ? c : { text: c };
      return U.el('td', { class: (i === 0 || cell.txt) ? 'txt' : (cell.warn ? 'warnnum' : '') }, cell.node || cell.text);
    }))));
    t.appendChild(tb);
    return U.el('div', { class: 'tablewrap', style: { maxHeight: 'none' } }, [t]);
  }

  function step(id, title, kids) {
    return U.el('div', { class: 'card calc-step', id: 'calc-' + id }, [
      U.el('h3', {}, title),
      U.el('div', { class: 'body' }, kids)
    ]);
  }

  function interpExplain(curve, target) {
    const { T, p, N } = curve;
    const r = LTE.interpAt(curve, target);
    const pct = Math.round(target * 100);
    if (N < 2) {
      return U.el('div', { class: 'walk' }, [
        U.el('h4', {}, 'LTE' + pct),
        'A single exotherm: LTE10 = LTE50 = LTE90 = that one temperature, ' + U.fx(r.value, 4) + ' \u00B0C.'
      ]);
    }
    let i = 0, j = 1;
    if (target <= p[0]) { i = 0; j = 1; }
    else if (target >= p[N - 1]) { i = N - 2; j = N - 1; }
    else { for (let k = 0; k < N - 1; k++) if (target >= p[k] && target <= p[k + 1]) { i = k; j = k + 1; break; } }
    const dp = p[j] - p[i], dT = T[j] - T[i];
    const w = dp === 0 ? 0.5 : (target - p[i]) / dp;
    return U.el('div', { class: 'walk' }, [
      U.el('h4', {}, 'LTE' + pct + ' - the temperature at which ' + pct + ' % of the buds in this cell have frozen'),
      U.el('ol', {}, [
        U.el('li', {}, 'Find the segment of the cumulative curve that contains p = ' + target.toFixed(2) +
          (r.extrapolated ? ' (it sits outside the observed p range, so the end segment is extended)' : '') + '.'),
        U.el('li', {}, 'That segment runs from exotherm ' + (i + 1) + ' at T = ' + U.fx(T[i], 4) +
          ' \u00B0C, p = ' + U.fx(p[i], 4) + ' to exotherm ' + (j + 1) + ' at T = ' + U.fx(T[j], 4) +
          ' \u00B0C, p = ' + U.fx(p[j], 4) + '.'),
        U.el('li', {}, ['The linear interpolation formula is',
          U.el('div', { class: 'formula' },
            'T = T\u1d62 + [(x \u2212 p\u1d62) / (p\u2c7c \u2212 p\u1d62)] \u00D7 (T\u2c7c \u2212 T\u1d62)')]),
        U.el('li', {}, 'Substitute: T = ' + U.fx(T[i], 4) + ' + [(' + target.toFixed(2) + ' \u2212 ' + U.fx(p[i], 4) +
          ') / ' + U.fx(dp, 4) + '] \u00D7 (' + U.fx(dT, 4) + ') = ' + U.fx(T[i], 4) + ' + ' + U.fx(w, 4) +
          ' \u00D7 (' + U.fx(dT, 4) + ') = ' + U.fx(r.value, 4) + ' \u00B0C.')
      ])
    ]);
  }

  function sigmoidWalk(vals, ppKey, method) {
    const est = LTE.EST[method];
    const s = LTE.summarize(vals, { pp: ppKey, method: method, sigmoidMinN: State.lte.sigmoidMinN });
    const kids = [U.el('h4', { style: { marginTop: '10px' } }, est.full)];
    kids.push(U.el('p', { class: 'small' }, est.note));
    kids.push(U.el('div', { class: 'formula' }, est.formula + '\n' + est.invert));
    const f = s.fit;
    if (f && f.ok) {
      const t10 = f.at(0.10), t50 = f.at(0.50), t90 = f.at(0.90);
      const items = [
        U.el('li', {}, 'Iterate until the residual sum of squares stops falling (this cell: ' + f.iters + ' iteration' + (f.iters === 1 ? '' : 's') + ').'),
        U.el('li', {}, 'Goodness of fit: residual SS = ' + U.fx(f.sse, 6) + ' on ' + f.df + ' df; pseudo-R\u00B2 = ' + U.fx(f.r2, 4) + '; RMSE = ' + U.fx(f.rmse, 4) + '; slope at the characteristic point = ' + U.fx(f.pctPerDeg, 2) + ' % frozen per \u00B0C.')
      ];
      if (method === 'logistic') {
        items.unshift(U.el('li', {}, 'Starting values: m\u2080 is the interpolated LTE50; k\u2080 comes from a rough slope of p against T.'));
        items.splice(2, 0, U.el('li', {}, 'Converged parameters: m = ' + U.fx(f.m, 4) + ' \u00B0C (SE ' + U.fx(f.seM, 4) + '), k = ' + U.fx(f.k, 4) + ' \u00B0C\u207B\u00B9 (SE ' + U.fx(f.seK, 4) + '). m is LTE50 directly.'));
        items.push(U.el('li', {}, 'Invert: T(x) = m + ln((1 \u2212 x)/x) / k.'));
        items.push(U.el('li', {}, 'LTE10 = ' + U.fx(f.m, 4) + ' + ln(0.90/0.10)/' + U.fx(f.k, 4) + ' = ' + U.fx(t10, 4) + ' \u00B0C.'));
        items.push(U.el('li', {}, 'LTE50 = m = ' + U.fx(t50, 4) + ' \u00B0C.'));
        items.push(U.el('li', {}, 'LTE90 = ' + U.fx(f.m, 4) + ' + ln(0.10/0.90)/' + U.fx(f.k, 4) + ' = ' + U.fx(t90, 4) + ' \u00B0C.'));
      } else if (method === 'logistic4') {
        items.unshift(U.el('li', {}, 'Starting values: A and B near the observed p range, m\u2080 the interpolated LTE50, k\u2080 from a rough slope.'));
        items.splice(2, 0, U.el('li', {}, 'Converged parameters: A = ' + U.fx(f.A, 4) + ' (SE ' + U.fx(f.seA, 4) + '), B = ' + U.fx(f.B, 4) + ' (SE ' + U.fx(f.seB, 4) + '), inflection m = ' + U.fx(f.m, 4) + ' \u00B0C (SE ' + U.fx(f.seM, 4) + '), k = ' + U.fx(f.k, 4) + ' \u00B0C\u207B\u00B9 (SE ' + U.fx(f.seK, 4) + ').'));
        items.push(U.el('li', {}, 'A lethal temperature x exists only when A < x < B. Invert: T(x) = m + ln((B \u2212 x)/(x \u2212 A)) / k.'));
        items.push(U.el('li', {}, 'LTE10 = ' + (isFinite(t10) ? U.fx(t10, 4) + ' \u00B0C' : 'not inverted (10 % is outside [A, B]); interpolation is used for this tail') + '.'));
        items.push(U.el('li', {}, 'LTE50 = ' + (isFinite(t50) ? U.fx(t50, 4) + ' \u00B0C (not equal to m unless A + B = 1; here m = ' + U.fx(f.m, 4) + ' \u00B0C)' : 'not inverted') + '.'));
        items.push(U.el('li', {}, 'LTE90 = ' + (isFinite(t90) ? U.fx(t90, 4) + ' \u00B0C' : 'not inverted (90 % is outside [A, B]); interpolation is used for this tail') + '.'));
      }
      kids.push(U.el('div', { class: 'walk' }, [
        U.el('h4', {}, 'Fit on this cell, under ' + LTE.PP[ppKey].full),
        U.el('ol', {}, items)
      ]));
    } else {
      kids.push(U.el('div', { class: 'notice' },
        est.short + ' was not fitted for this cell' + (f && f.reason ? ' (' + f.reason + ')' : '') +
        '. The walk-through still shows interpolation above; that is also what every other module would use.'));
    }
    return kids;
  }

  function build() {

    const cell = currentCell();
    const vals = cell.values.filter(v => typeof v === 'number' && isFinite(v));
    const N = vals.length;
    const sums = mappedDatasets().length ? computeSummaries() : [];
    const inForce = LTE.fwLabel(LTE.fwId(State.lte.pp, State.lte.method), 'long');
    const curveForce = LTE.buildCurve(vals, State.lte.pp);
    const sumForce = LTE.summarize(vals, State.lte);

    const split = U.el('div', { class: 'split' });

      dependencies and no installer. The calculations run in your browser.</p>
      <p class="small">A CSV you upload is read only on this page and is not sent to a server. If you opened the GitHub Pages copy, that host serves this static file and nothing else. You can also download <code>LTEITGO_v01.01.01.html</code> and open it offline. See the README for the column list and for <code>examples/demo_lte.csv</code>.</p>

      <p class="small"><b>The tabs, in the order they are meant to be used:</b></p>
      <ul class="small" style="margin:0 0 12px;padding-left:18px">
        <li><b>0 Data &amp; mapping</b> - load the CSVs, name the columns, set the plotting position and estimator that everything downstream uses.</li>

function showView(name) {
  if (name === 'm1') name = 'lte';
  if (name === 'notes' || !VIEWS[name]) { if (name === 'notes') showAbout(); return; }
  currentView = name;
  U.$$('#tabs button').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === name));
  U.$$('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + name));
  try { VIEWS[name].build(); }
  catch (e) {
    const host = document.getElementById('view-' + name);
    U.clear(host).appendChild(U.el('div', { class: 'card' }, [U.el('div', { class: 'body' }, [
      U.el('div', { class: 'notice err' }, 'Something went wrong while drawing this tab: ' + U.esc(e.message))
    ])]));
    console.error(e);
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function renderStatus() {
  const host = document.getElementById('appStatus');
  if (!host) return;
  U.clear(host);
  const ds = mappedDatasets();
  const sums = ds.length ? computeSummaries() : [];
  const bits = [
    ['datasets', State.datasets.length],
    ['cells', sums.length],
    ['exotherms', sums.reduce((a, s) => a + s.stats.n, 0)]
  ];
  bits.forEach(([k, v]) => host.appendChild(U.el('span', {}, [U.el('b', {}, String(v)), ' ' + k])));
  host.appendChild(U.el('span', {}, [
    U.el('b', {}, LTE.fwLabel(LTE.fwId(State.lte.pp, State.lte.method)))
  ]));
}

document.addEventListener('DOMContentLoaded', () => {
  U.$$('#tabs button').forEach(b => b.addEventListener('click', () => showView(b.getAttribute('data-view'))));
  const about = document.getElementById('btnAbout');
  if (about) about.addEventListener('click', showAbout);
  Tables.listen();
  renderStatus();
  showView('data');
});
</script>
</body>
